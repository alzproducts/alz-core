# One verify run per worktree, driven by ./verify (ADR-0020). Every value comes from the run's compose.env.
# intentional: no worktree bind mount, no fixed host port; the only host mounts are <evidence>/logs/<service>/ (COR-320).
# intentional: environment: holds only stack-owned keys (COR-320 D3, D9, D11); every other key comes from env_file.

x-stack-env: &stack-env
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: '5432'
    DB_DATABASE: postgres
    DB_USERNAME: postgres
    DB_PASSWORD: '${VERIFY_DB_PASSWORD:?}'
    DB_SSLMODE: disable
    DB_URL: ''
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_PASSWORD: '${VERIFY_REDIS_PASSWORD:?}'
    REDIS_URL: ''
    REDIS_USERNAME: ''

x-app-env: &app-env
    <<: *stack-env
    APP_ENV: local
    APP_URL: 'http://127.0.0.1:8000'
    PORT: '8000'
    # intentional: no Supabase in a verify run; X-Local-Bypass authenticates, so this URL only has to refuse.
    SUPABASE_URL: 'http://127.0.0.1:9'
    SHOPWIRED_SALE_CATEGORY_ID: '2000000001'
    # intentional: the main .env may skip the entrypoint's DB check; a run always exercises it.
    SKIP_DB_CHECK: 'false'

x-env-files: &env-files
    - path: '${VERIFY_ENV_FILE:?}'
      required: false
    # Fill-if-blank keys and --env-override lines; listed last, so they win over the main .env.
    - path: '${VERIFY_RUN_ENV:?}'
      required: true

services:
    pgsql:
        image: '${VERIFY_PGSQL_IMAGE:?}'
        # intentional: roles.sql is baked in, not bind-mounted, so no worktree path reaches a container (COR-320 AC16).
        build:
            context: ./src/database/baseline
            dockerfile_inline: |
                FROM supabase/postgres:${SUPABASE_POSTGRES_VERSION:?}
                COPY roles.sql /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        profiles:
            - own-postgres
        environment:
            POSTGRES_PASSWORD: '${VERIFY_DB_PASSWORD:?}'
        # intentional: overrides the image's ~20 s healthcheck, which marks a slow first boot unhealthy.
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-U'
                - postgres
                - '-h'
                - localhost
            start_period: 120s
            interval: 2s
            timeout: 5s
            retries: 30

    auth-migrate:
        image: 'supabase/auth:${SUPABASE_AUTH_VERSION:?}'
        profiles:
            - own-postgres
        command:
            - auth
            - migrate
        restart: 'no'
        depends_on:
            pgsql:
                condition: service_healthy
        environment:
            GOTRUE_DB_DRIVER: postgres
            GOTRUE_DB_DATABASE_URL: 'postgres://supabase_auth_admin:${VERIFY_DB_PASSWORD:?}@pgsql:5432/postgres'
            # intentional: migrate signs nothing; Auth refuses to start without a secret.
            GOTRUE_JWT_SECRET: verify-migrate-placeholder-secret-not-used
            API_EXTERNAL_URL: 'http://localhost:9999'
            GOTRUE_SITE_URL: 'http://localhost:3000'

    realtime-migrate:
        image: '${VERIFY_REALTIME_IMAGE:?}'
        # intentional: the script is baked in, not bind-mounted, as pgsql bakes roles.sql.
        build:
            context: ./src/database/baseline
            dockerfile_inline: |
                FROM supabase/realtime:${SUPABASE_REALTIME_VERSION:?}
                COPY realtime-migrate.sh /usr/local/bin/realtime-migrate
                ENTRYPOINT ["bash", "/usr/local/bin/realtime-migrate"]
        profiles:
            - own-postgres
        restart: 'no'
        depends_on:
            pgsql:
                condition: service_healthy
        environment:
            DB_HOST: pgsql
            DB_PASSWORD: '${VERIFY_DB_PASSWORD:?}'

    redis:
        image: 'redis:alpine'
        command:
            - redis-server
            - '--requirepass'
            - '${VERIFY_REDIS_PASSWORD:?}'
        environment:
            VERIFY_REDIS_PASSWORD: '${VERIFY_REDIS_PASSWORD:?}'
        healthcheck:
            test:
                - CMD-SHELL
                - 'redis-cli -a "$$VERIFY_REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            interval: 2s
            timeout: 5s
            retries: 30

    # Migrates once (dev:seed-fake runs migrate) and seeds; app and worker start only after it exits 0.
    # intentional: Postgres's network namespace, so the seed's loopback-only host guard holds (COR-320 D2).
    seed:
        image: '${VERIFY_TEST_IMAGE:?}'
        build:
            context: ./src
            dockerfile: Dockerfile.verify
            args:
                RUNTIME_IMAGE: '${VERIFY_RUNTIME_IMAGE:?}'
        network_mode: 'service:pgsql'
        entrypoint:
            - php
            - artisan
            - 'dev:seed-fake'
            - '--no-interaction'
        restart: 'no'
        depends_on:
            auth-migrate:
                condition: service_completed_successfully
            realtime-migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        env_file: *env-files
        environment:
            <<: *app-env
            DB_HOST: 127.0.0.1
        volumes:
            - '${VERIFY_LOGS:?}/seed:/var/www/html/storage/logs'

    app:
        image: '${VERIFY_RUNTIME_IMAGE:?}'
        # Built from the git archive of HEAD that verify up extracts to ./src (COR-317 D2); worker shares the image.
        build:
            context: ./src
        depends_on:
            seed:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        ports:
            - '127.0.0.1::8000'
        env_file: *env-files
        environment: *app-env
        # Keeps the image's own /up check; only the timing is shortened so up --wait returns promptly.
        healthcheck:
            interval: 3s
            start_period: 180s
            start_interval: 2s
            retries: 60
        volumes:
            - '${VERIFY_LOGS:?}/app:/var/www/html/storage/logs'

    worker:
        image: '${VERIFY_RUNTIME_IMAGE:?}'
        command:
            - php
            - artisan
            - horizon
            - '--environment=production'
        depends_on:
            seed:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        env_file: *env-files
        environment: *app-env
        healthcheck:
            test:
                - CMD
                - php
                - artisan
                - 'horizon:status'
            interval: 3s
            start_period: 180s
            start_interval: 2s
            retries: 60
        volumes:
            - '${VERIFY_LOGS:?}/worker:/var/www/html/storage/logs'

    # Run per call by `verify test`; no env_file, so phpunit.xml's defaults apply (COR-320 D3).
    test:
        image: '${VERIFY_TEST_IMAGE:?}'
        profiles:
            - test
        entrypoint:
            - vendor/bin/pest
            - '--exclude-group=repo-static'
            - '--no-coverage'
        environment:
            <<: *stack-env
            APP_KEY: '${VERIFY_TEST_APP_KEY:-}'
            API_KEY_ENCRYPTION_SECRET: '${VERIFY_TEST_API_KEY_ENCRYPTION_SECRET:-}'
        volumes:
            - '${VERIFY_LOGS:?}/test:/var/www/html/storage/logs'

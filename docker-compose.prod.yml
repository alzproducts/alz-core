# ==============================================================================
# Docker Compose for Production-like Testing
# ==============================================================================
# Purpose: Test production Dockerfile locally before Railway deployment
# Usage: export BASELINE_DB_PASSWORD=$(openssl rand -hex 16) first (Auth puts it in a URL unescaped), then
#        docker compose -f docker-compose.prod.yml up --build
# The database is the Supabase baseline (database/baseline/, ADR-0016).
# ==============================================================================

include:
  - path: database/baseline/compose.yaml
    env_file: database/baseline/versions.env

services:
  # ----------------------------------------------------------------------------
  # Laravel Application (Octane + Swoole)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: alz-core-prod
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: "ALZ Core (Local Production Test)"
      APP_ENV: production
      APP_DEBUG: false
      # ⚠️ WARNING: For local testing ONLY. Use strong credentials in production.
      APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_URL: http://localhost:8000

      # Railway simulation (dynamic PORT)
      PORT: 8000

      # Octane
      OCTANE_SERVER: swoole
      OCTANE_WORKERS: 2
      OCTANE_TASK_WORKERS: 2
      OCTANE_MAX_REQUESTS: 500

      # Logging
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug

      # Database (PostgreSQL)
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres
      # intentional: the baseline's password from the shell, so a repo .env cannot split app and database.
      DB_PASSWORD: ${BASELINE_DB_PASSWORD:?}
      DB_SSLMODE: prefer

      # Redis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

      # Cache & Queue
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_ENCRYPT: true

      # Horizon Dashboard (for testing)
      HORIZON_USER: admin
      # ⚠️ WARNING: For local testing ONLY. Use strong credentials in production.
      HORIZON_PASSWORD: ${HORIZON_PASSWORD:-secret}

      # Entrypoint script controls
      AUTO_MIGRATE: true
      SKIP_DB_CHECK: false

      # Supabase (not needed for local testing)
      SUPABASE_URL: ${SUPABASE_URL}

      # Telescope (disabled in production)
      TELESCOPE_ENABLED: false
    depends_on:
      pgsql:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # intentional: included services join only the project's default network.
    networks:
      - default
      - alz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Redis (Cache & Queues)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alz-core-redis-prod
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - alz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  redis_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  alz-network:
    driver: bridge

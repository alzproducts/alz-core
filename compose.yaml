# Local development services. PHP runs natively; Supabase provides PostgreSQL (see docs/guides/local-setup.md).
# intentional: one project name for every checkout, so all git worktrees share one Redis on its host port (COR-269).
name: alz-core

services:
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - alz-core
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        command: redis-server --appendonly yes

networks:
    alz-core:
        driver: bridge

# intentional: an explicit name keeps the existing local volume's data.
volumes:
    redis-data:
        name: alz-core_sail-redis
        driver: local

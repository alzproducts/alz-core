# Local development services. PHP runs natively; Supabase provides PostgreSQL (see docs/guides/local-setup.md).
# intentional: one project name for every checkout, so all git worktrees share one Redis on its host port (COR-269).
name: alz-core

services:
    pgsql:
        image: 'postgres:17-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql/data'
        networks:
            - alz-core
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - alz-core
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        command: redis-server --appendonly yes

networks:
    alz-core:
        driver: bridge

# intentional: explicit names keep the existing local volumes' data.
volumes:
    pgsql-data:
        name: alz-core_sail-pgsql
        driver: local
    redis-data:
        name: alz-core_sail-redis
        driver: local

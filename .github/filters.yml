# Shared dorny/paths-filter definitions.
# Referenced by ci.yml only, so the "is there reviewable code here?" decision
# lives in one place — change a path once, ci.yml follows. Docs-only PRs (no
# match below) skip lint and tests.
code:
  - 'app/**'
  - 'config/**'
  - 'database/**'
  - 'routes/**'
  - 'tests/**'
  - 'composer.json'
  - 'composer.lock'
  - 'phpstan.neon'
  - 'phpunit.xml'
  - 'phpunit-*.xml'
  - 'pint.json'
  - 'psalm.xml'
  - 'deptrac.yaml'
  - 'phparkitect.php'
  - '.github/workflows/**'

# Offline dev image (Dockerfile.dev) — rebuild/retest only when its inputs change
dev_image:
  - 'Dockerfile.dev'
  - 'Dockerfile.dev.dockerignore'
  - 'composer.json'
  - 'composer.lock'
  - 'database/**'
  - '.env.example'
  - '.github/workflows/ci.yml'
  - 'Makefile'
  - '.github/filters.yml'

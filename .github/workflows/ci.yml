name: Laravel 13 CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  COMPOSER_NO_INTERACTION: 1

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect what changed — skips expensive jobs for docs-only PRs
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      dev_image: ${{ steps.filter.outputs.dev_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # see .github/filters.yml
          filters: .github/filters.yml

  # Fast feedback: Code style + static analysis (runs PHPStan, Pint, PHPArkitect, Deptrac, TLint)
  code-style:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, json, bcmath, soap
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          path: storage/framework/phpstan
          key: phpstan-${{ hashFiles('**/*.php') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            phpstan-${{ hashFiles('**/*.php') }}-
            phpstan-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: Run Laravel Pint
        run: composer run lint

  # Test suite without coverage (coverage enforced locally via make test-coverage / mutation testing)
  tests:
    name: Pest Tests + Coverage (PostgreSQL 17)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: pgsql
      # The Supabase baseline (ADR-0016); DB_PORT and DB_PASSWORD come from the "Start the Supabase baseline" step.
      DB_HOST: 127.0.0.1
      DB_DATABASE: postgres
      DB_USERNAME: postgres
      DB_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      TELESCOPE_ENABLED: false

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the Supabase baseline
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          {
            echo "BASELINE_DB_PASSWORD=$password"
            echo "DB_PASSWORD=$password"
            echo "PGPASSWORD=$password"
          } >> "$GITHUB_ENV"
          export BASELINE_DB_PASSWORD="$password"
          export BASELINE_DIR="$GITHUB_WORKSPACE/database/baseline"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          dc=(docker compose -p baseline -f database/baseline/compose.yaml --env-file database/baseline/versions.env)
          "${dc[@]}" up -d --wait pgsql
          "${dc[@]}" run --rm auth-migrate
          "${dc[@]}" run --rm realtime-migrate
          published="$("${dc[@]}" port pgsql 5432)"
          port="${published##*:}"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::unexpected published port: $published"
            exit 1
          fi
          echo "DB_PORT=$port" >> "$GITHUB_ENV"

      - name: Print baseline role privileges
        # AC2: migrations run as a non-superuser postgres that bypasses RLS and cannot create in auth, as on hosted Supabase.
        run: |
          row="$(psql -h 127.0.0.1 -p "$DB_PORT" -U postgres -d postgres -At -F '|' -c "select rolsuper, rolbypassrls, has_schema_privilege('postgres', 'auth', 'CREATE') from pg_roles where rolname = current_user")"
          echo "$row"
          [[ "$row" == 'f|t|f' ]]

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql, bcmath, soap, intl, gd, exif, iconv, redis
          ini-values: |
            memory_limit=512M
            zend.assertions=1
            opcache.enable_cli=1
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          chmod -R 775 storage bootstrap/cache

      - name: Run database migrations
        run: make migrate

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Execute test suite
        run: vendor/bin/pest --parallel --no-coverage --exclude-group=integration --exclude-group=seed-command --exclude-group=list-parity --exclude-group=docker

  # Security scanning (60-90 seconds)
  security:
    name: Security Audit & Dependency Scan
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: Run Composer audit
        run: composer audit --format=json

  # Offline dev image (Dockerfile.dev) — builds the image and runs its test suite with no network
  dev-image:
    name: Offline Dev Image Build & Test
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.dev_image == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read the Supabase baseline pin
        id: pin
        run: |
          for key in SUPABASE_POSTGRES_VERSION SUPABASE_AUTH_VERSION SUPABASE_REALTIME_VERSION; do
            value="$(sed -n "s/^${key}=//p" database/baseline/versions.env)"
            [[ -n "$value" ]] || { echo "::error::$key missing from database/baseline/versions.env"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.dev
          build-args: |
            SUPABASE_POSTGRES_VERSION=${{ steps.pin.outputs.SUPABASE_POSTGRES_VERSION }}
            SUPABASE_AUTH_VERSION=${{ steps.pin.outputs.SUPABASE_AUTH_VERSION }}
            SUPABASE_REALTIME_VERSION=${{ steps.pin.outputs.SUPABASE_REALTIME_VERSION }}
          load: true
          tags: alz-core-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suite offline
        # intentional: the image excludes .git, so the git-listing static tests would fail closed
        run: docker run --rm --network none alz-core-dev make test TEST_ARGS=--exclude-group=repo-static

  # Psalm Taint Analysis (60-90 seconds)
  taint-analysis:
    name: Psalm Taint Analysis (Security)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # Psalm requires: dom, simplexml, tokenizer (in addition to standard extensions)
          extensions: mbstring, xml, ctype, json, bcmath, soap, dom, simplexml, tokenizer
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Psalm results
        uses: actions/cache@v4
        with:
          path: storage/framework/psalm
          key: psalm-${{ hashFiles('**/*.php') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            psalm-${{ hashFiles('**/*.php') }}-
            psalm-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: Run Psalm taint analysis
        run: make psalm-ci

  # Layer-Specific Mutation Testing (see tests/TestingStrategy.md)
  # Only runs on PRs to main (develop->main promotion) - informational, non-blocking
  # Jobs run in parallel for faster feedback

  # Domain Layer: 90%+ MSI (strict) - pure business logic, highest value
  mutation-domain:
    name: Mutation Testing (Domain - 90%+ MSI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.base_ref == 'main'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, soap, intl, gd, exif, iconv
          ini-values: |
            memory_limit=512M
            zend.assertions=1
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          chmod -R 775 storage bootstrap/cache

      - name: Run Pest Mutate on Domain Layer
        run: make mutate-domain

  # Application Layer: 70%+ mutation score - Uses Pest mutate (namespace-based filtering)
  mutation-application:
    name: Mutation Testing (Application - 70%+ Pest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.base_ref == 'main'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, soap, intl, gd, exif, iconv
          ini-values: |
            memory_limit=512M
            zend.assertions=1
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          chmod -R 775 storage bootstrap/cache

      - name: Run Pest mutation testing on Application Layer
        run: make mutate-app
